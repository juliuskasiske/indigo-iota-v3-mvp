# ============================================================================
#  LLM model prices  —  THIS IS THE ONLY FILE YOU EDIT TO CHANGE PRICES.
# ============================================================================
#
#  Prices are US dollars per 1,000,000 tokens (the way vendor price sheets quote
#  them). Input (prompt) and output (completion) are priced separately.
#
#  To change a price: edit the number, save. That's it.
#    - The next LLM call notices the change and appends a new, dated row to the
#      price history in the database (so you keep a full record of when each
#      price took effect — nothing is overwritten).
#    - Every call also stamps the exact price it paid onto its own usage row,
#      so past costs are never altered by a later edit.
#    - To apply an edit immediately (instead of waiting for the next call):
#        cd backend && python -m src.billing sync
#
#  The model key is the LLMBase model id (the string you send as `model`).
# ============================================================================

